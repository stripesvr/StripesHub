<head>

    <style>

            position: fixed;

            left: 0;

            background: repeating-linear-gradient(-45deg, #f1c40f 0 12px, #0a0a0c 12px 24px);
            z-index: 3;
        }
    </style>
</head>
<body>
    <div class="hazard" aria-hidden="true"></div>
    <div class="page">
        <nav class="topbar">
            <a class="back" href="https://stripesvr.github.io/StripesHub"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m11 6-6 6 6 6"/></svg>Home</a>
            <span class="wordmark">stripes.lol</span>
        </nav>

        <header class="header">
            <h1 class="title" id="typewriter"></h1>
        </header>

        <main>
        <div class="list">
            <a class="row" href="#">
                <span class="row-body">
                    <span class="row-title">?????</span>
                    <span class="row-desc">?????</span>
                </span>
                <span class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></span>
            </a>
            <a class="row" href="#">
                <span class="row-body">
                    <span class="row-title">?????</span>
                    <span class="row-desc">?????</span>
                </span>
                <span class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></span>
            </a>
        </div>
        </main>
    </div>
<script>
        // Set of strange, shifting characters
        const weirdChars = '¥§¶#$@%&*!?ØΞΨΩΔ░▒▓█<>/\\|?=+-';
        const targetWords = ["█▒░?????░▒█", "§Ψ#UNRELEASED#Ψ§", "Ø?Ø?Ø?Ø?Ø?Ø"];
        
        let wordIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        const typewriterElement = document.getElementById("typewriter");

        function getRandomChar() {
            return weirdChars[Math.floor(Math.random() * weirdChars.length)];
        }

        function type() {
            const currentWord = targetWords[wordIndex];
            
            if (isDeleting) {
                typewriterElement.textContent = currentWord.substring(0, charIndex - 1);
                charIndex--;
            } else {
                // Adds a random flickering glitch character at the typing head
                const typedPart = currentWord.substring(0, charIndex);
                const glitchTail = charIndex < currentWord.length ? getRandomChar() : '';
                typewriterElement.textContent = typedPart + glitchTail;
                charIndex++;
            }

            let nextSpeed = isDeleting ? 70 : 120;

            if (!isDeleting && charIndex > currentWord.length) {
                nextSpeed = 2000; // Pause at full word
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                wordIndex = (wordIndex + 1) % targetWords.length; 
                nextSpeed = 400; 
            }

            setTimeout(type, nextSpeed);
        }

        document.addEventListener("DOMContentLoaded", function() {
            setTimeout(type, 500);
        });
    </script>
</body>
</html>
