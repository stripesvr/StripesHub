<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>?????</title>
    <style>
        /* --- GLOBAL STYLES --- */
        body {
            background-color: #0d0d11;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 60px 20px 80px 20px;
            box-sizing: border-box;
            position: relative;
            overflow-x: hidden;
        }

        /* --- CAUTION TAPE OVERLAYS --- */
        .caution-tape {
            position: absolute;
            width: 160vw;
            height: 45px;
            background: repeating-linear-gradient(
                -45deg,
                #f1c40f,
                #f1c40f 25px,
                #111111 25px,
                #111111 50px
            );
            display: flex;
            align-items: center;
            justify-content: space-around;
            font-weight: 900;
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: #111111;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
            z-index: 10;
            pointer-events: none;
        }

        .caution-tape span {
            background-color: #f1c40f;
            padding: 0 10px;
        }

        /* Multiple Angled Tapes */
        .tape-1 { transform: rotate(-15deg) translateY(100px); }
        .tape-2 { transform: rotate(10deg) translateY(320px); }
        .tape-3 { transform: rotate(-8deg) translateY(480px); }
        .tape-4 { transform: rotate(22deg) translateY(200px); }

        /* --- GLOWING TYPEWRITER EFFECT --- */
        .title-container {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 50px;
            z-index: 1;
        }

        .typewriter-text {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.8), 
                         0 0 20px rgba(255, 51, 51, 0.6);
            letter-spacing: 2px;
            border-right: 3px solid #ff3333;
            white-space: nowrap;
            background: transparent;
            padding-right: 4px;
            animation: blink 0.75s step-end infinite;
            font-family: monospace; /* Gives a technical glitch/mystery vibe */
        }

        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: #ff3333; }
        }

        /* --- BUTTONS CONTAINER --- */
        .links-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 40px;
            z-index: 1;
        }

        /* --- EDITABLE BUTTON STYLES --- */
        .card-link {
            background: linear-gradient(135deg, #16161f 0%, #1f1f2e 100%);
            border: 1px solid #33334d;
            border-radius: 12px;
            padding: 15px 20px;
            text-decoration: none;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .card-link:hover {
            transform: translateY(-3px);
            border-color: #ff3333;
            box-shadow: 0 6px 20px rgba(255, 51, 51, 0.2);
        }

        .btn-name {
            font-size: 1.25rem;
            font-weight: bold;
            color: #ff4d4d;
            margin-bottom: 5px;
        }

        .btn-description {
            font-size: 0.9rem;
            color: #b0b0bc;
            line-height: 1.4;
        }

        /* --- SMALL HOME BUTTON STYLE --- */
        .home-btn {
            background: #16161f;
            border: 1px solid #33334d;
            border-radius: 20px;
            padding: 8px 16px;
            text-decoration: none;
            color: #b0b0bc;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            margin-top: auto;
            z-index: 1;
        }

        .home-btn:hover {
            border-color: #ff3333;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(255, 51, 51, 0.3);
        }
    </style>
</head>
<body>

    <div class="caution-tape tape-1">

    <div class="title-container">

    <script>
        // Set of strange, shifting characters
        const weirdChars = '¥§¶#$@%&*!?ØΞΨΩΔ░▒▓█<>/\\|?=+-';
        const targetWords = ["█▒░?????░▒█", "§Ψ#UNRELEASED#Ψ§", "Ø?Ø?Ø?Ø?Ø?Ø"];
        
        let wordIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        const typewriterElement = document.getElementById("typewriter");

        function getRandomChar() {
            return weirdChars[Math.floor(Math.random() * weirdChars.length)];
        }

        function type() {
            const currentWord = targetWords[wordIndex];
            
            if (isDeleting) {
                typewriterElement.textContent = currentWord.substring(0, charIndex - 1);
                charIndex--;
            } else {
                // Adds a random flickering glitch character at the typing head
                const typedPart = currentWord.substring(0, charIndex);
                const glitchTail = charIndex < currentWord.length ? getRandomChar() : '';
                typewriterElement.textContent = typedPart + glitchTail;
                charIndex++;
            }

            let nextSpeed = isDeleting ? 70 : 120;

            if (!isDeleting && charIndex > currentWord.length) {
                nextSpeed = 2000; // Pause at full word
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                wordIndex = (wordIndex + 1) % targetWords.length; 
                nextSpeed = 400; 
            }

            setTimeout(type, nextSpeed);
        }

        document.addEventListener("DOMContentLoaded", function() {
            setTimeout(type, 500);
        });
    </script>

</body>
